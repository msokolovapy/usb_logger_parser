[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "usb_logger_parser"
version = "0.1.0"
authors = [
  { name = "Maria", email = "banksia828@gmail.com" },
]
description = "Parse cold chain USB temperature logger CSV files and detect excursions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy==2.4.4",
    "pandas==3.0.2",
    "xlsxwriter==3.2.9",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/usb_logger_parser"]

[tool.hatch.build]
include = [
    "src/usb_logger_parser/resources/*",
]

[tool.black]
target-version = ["py312"]
