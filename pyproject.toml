[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "usb_logger_parser"
version = "0.1.0"
authors = [
  { name = "Maria", email = "banksia828@gmail.com" },
]
description = "Parse cold chain USB temperature logger CSV files and detect excursions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
